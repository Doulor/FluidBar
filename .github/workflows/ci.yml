name: ci

on:
  push:
    branches: [main, "v2/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FluidBar.sln

      - name: Release compiler gate and full regression
        shell: pwsh
        run: ./build/publish.ps1 -SelfContained -VerifyOnly

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests
          if-no-files-found: ignore
