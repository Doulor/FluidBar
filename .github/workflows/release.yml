name: release

# FluidBar release workflow (M6 draft — Lead co-reviews before first use).
# Triggers:
#   * workflow_dispatch — manual release with an explicit version.
#   * push tag v*      — publishes that tag as a GitHub Release.
# Signing status: UNSIGNED for now. The future Authenticode step is documented in
# docs/rewrite/release.md (§ Signing). Do not publish a public release until that section is implemented.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, without leading v). Empty = derive from git tag/VersionPrefix.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: build / test / publish (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # Actions are pinned to major versions; pin to full commit SHAs before public release (Lead review).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version) -and '${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '0.0.0-ci'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Restore
        shell: pwsh
        run: dotnet restore FluidBar.sln

      - name: Build + warning gate + tests + publish
        shell: pwsh
        run: |
          # Tee the build log and re-emit failures as ::error:: annotations. The job log needs admin rights to
          # read, but annotations are readable through the API, which is what makes a red release diagnosable
          # (2026-10-27: the step exited 1 and the reason was invisible).
          $log = Join-Path $env:RUNNER_TEMP 'publish.log'
          ./build/publish.ps1 -Version '${{ steps.version.outputs.version }}' *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host '::group::publish.log tail'
            Get-Content $log -Tail 40 | ForEach-Object { Write-Host $_ }
            Write-Host '::endgroup::'
            $reported = 0
            foreach ($line in (Get-Content $log)) {
              if ($reported -ge 20) { break }
              if ($line -match 'error|FAIL|失败|Exception|Traceback') {
                Write-Host "::error::$line"
                $reported++
              }
            }
            throw "build/publish.ps1 failed with exit code $code"
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidBar-${{ steps.version.outputs.version }}-win-x64
          path: |
            build/artifacts/*.zip
            build/publish/win-x64/FluidBar.exe
            build/reports/publish-${{ steps.version.outputs.version }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = Get-ChildItem build/artifacts/*.zip | Select-Object -First 1
          $exe = Get-ChildItem build/publish/win-x64/FluidBar.exe | Select-Object -First 1
          $manifest = Get-ChildItem "build/reports/publish-$version.json" | Select-Object -First 1
          if (-not $zip -or -not $exe -or -not $manifest) {
            throw 'release artifact, installer exe or publish manifest is missing'
          }
          Write-Host "Uploading $($zip.Name), $($exe.Name); SHA-256 manifest=$($manifest.Name); signing: unsigned"

          # A semver prerelease (3.1.0-preview.1) has to be flagged, otherwise GitHub marks it as "latest" and
          # stable-channel installs are offered a preview. --latest=false keeps releases/latest on the last stable.
          $prereleaseArgs = @()
          if ($version -match '-') {
            $prereleaseArgs = @('--prerelease', '--latest=false')
          }

          gh release create "v$version" $zip.FullName $exe.FullName $manifest.FullName `
            --title "FluidBar $version" `
            --notes "Automated build. Installer is UNSIGNED until Authenticode signing lands (see docs/rewrite/release.md). SHA-256 in publish-$version.json is consumed by the in-app update checker." `
            --verify-tag @prereleaseArgs

      - name: Release summary
        if: always()
        shell: pwsh
        run: |
          Write-Host '== reports =='
          Get-ChildItem build/reports -ErrorAction SilentlyContinue | Format-Table Name, Length
