name: release

# FluidBar release workflow (M6 draft — Lead co-reviews before first use).
# Triggers:
#   * workflow_dispatch — manual release with an explicit version.
#   * push tag v*      — publishes that tag as a GitHub Release.
# Signing status: the first public 4.0.0 release is intentionally unsigned (no certificate yet).
# The in-app updater still requires the GitHub asset SHA-256 digest. Authenticode signing is
# documented in docs/rewrite/release.md (§ Signing) and should be enabled for the next release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, without leading v). Empty = derive from git tag/VersionPrefix.'
        required: false
        type: string
      verify_published:
        description: 'Also verify the notes of an already-published version after a manual build.'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: build / test / publish (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # Actions are pinned to major versions; pin to full commit SHAs before public release (Lead review).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version) -and '${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '0.0.0-ci'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Restore
        shell: pwsh
        run: dotnet restore FluidBar.sln

      - name: Build + warning gate + tests + publish
        shell: pwsh
        run: |
          # Tee the build log and re-emit the tail as ::error:: annotations. The job log needs admin rights to read,
          # while annotations are readable through the API — that is what makes a red release diagnosable
          # (2026-10-27: the step exited 1 twice and the reason was invisible).
          $log = Join-Path $env:RUNNER_TEMP 'publish.log'
          $failed = $false
          try {
            ./build/publish.ps1 -Version '${{ steps.version.outputs.version }}' -SelfContained *>&1 | Tee-Object -FilePath $log
          } catch {
            $failed = $true
            Write-Host "::error::publish.ps1 threw: $($_.Exception.Message)"
          }
          if ($failed -or $LASTEXITCODE -ne 0) {
            if (Test-Path $log) {
              $lines = Get-Content $log
              Write-Host '::group::publish.log tail'
              $lines | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
              Write-Host '::endgroup::'
              # Annotations are capped, so prioritise the lines that name the failure.
              $hits = $lines | Where-Object { $_ -match 'error [A-Z]+\d+|error:|\[FAIL\]|failed|失败' } | Select-Object -Last 10
              if (-not $hits) { $hits = $lines | Select-Object -Last 6 }
              foreach ($line in $hits) { Write-Host "::error::$line" }
            }
            exit 1
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluidBar-${{ steps.version.outputs.version }}-win-x64
          path: |
            build/artifacts/*.zip
            build/publish/win-x64/FluidBar.exe
            build/reports/publish-${{ steps.version.outputs.version }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = Get-ChildItem build/artifacts/*.zip | Select-Object -First 1
          $exe = Get-ChildItem build/publish/win-x64/FluidBar.exe | Select-Object -First 1
          $manifest = Get-ChildItem "build/reports/publish-$version.json" | Select-Object -First 1
          if (-not $zip -or -not $exe -or -not $manifest) {
            throw 'release artifact, installer exe or publish manifest is missing'
          }
          Write-Host "Uploading $($zip.Name), $($exe.Name); SHA-256 manifest=$($manifest.Name); signing: unsigned"

          # A semver prerelease (3.1.0-preview.1) has to be flagged, otherwise GitHub marks it as "latest" and
          # stable-channel installs are offered a preview. --latest=false keeps releases/latest on the last stable.
          $prereleaseArgs = @()
          if ($version -match '-') {
            $prereleaseArgs = @('--prerelease', '--latest=false')
          }

          # Read release notes from a UTF-8 file and hand the file itself to gh. Passing a
          # Chinese markdown body through a PowerShell native-command argument or pipeline can hit
          # the Windows ANSI/ASCII boundary and turn every non-ASCII character into "?", which is
          # what happened to the v4.0.0 body. --notes-file makes gh read the original UTF-8 bytes.
          $notesFile = Join-Path $PWD "docs/rewrite/RELEASE-$version.md"
          if (-not (Test-Path $notesFile)) {
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
            $fallback = "Automated build. Installer is UNSIGNED until Authenticode signing lands (see docs/rewrite/release.md). SHA-256 in publish-$version.json is consumed by the in-app update checker."
            [System.IO.File]::WriteAllText($notesFile, $fallback, [System.Text.UTF8Encoding]::new($false))
          }

          gh release create "v$version" $zip.FullName $exe.FullName $manifest.FullName `
            --title "FluidBar $version" `
            --notes-file $notesFile `
            --verify-tag @prereleaseArgs

      - name: Verify published release notes
        if: github.ref_type == 'tag' || inputs.verify_published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notesFile = Join-Path $PWD "docs/rewrite/RELEASE-$version.md"
          if (-not (Test-Path -LiteralPath $notesFile)) {
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          }
          ./build/verify-release-notes.ps1 -Version $version -NotesFile $notesFile

      - name: Release summary
        if: always()
        shell: pwsh
        run: |
          Write-Host '== reports =='
          Get-ChildItem build/reports -ErrorAction SilentlyContinue | Format-Table Name, Length
