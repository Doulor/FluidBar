<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">FluidBar · Liquid Island</title>
  <desc id="desc">FluidBar 软件标志：墨蓝圆角方形中的液态玻璃灵动岛，岛屿内有流动的蓝青液面、信息条纹和明亮的状态光点。</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="40" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2933"/>
      <stop offset="0.52" stop-color="#101B24"/>
      <stop offset="1" stop-color="#080E14"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(349 338) rotate(125) scale(178 224)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39C8D4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#39C8D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="112" y1="184" x2="390" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8F8F7" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#7BCBD5" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#91A8C6" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="liquid" x1="104" y1="213" x2="394" y2="339" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70E4D6"/>
      <stop offset="0.44" stop-color="#36C4D6"/>
      <stop offset="0.76" stop-color="#3E9FDB"/>
      <stop offset="1" stop-color="#6572D9"/>
    </linearGradient>
    <linearGradient id="liquidShade" x1="256" y1="250" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081723" stop-opacity="0"/>
      <stop offset="1" stop-color="#081723" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="rim" x1="108" y1="184" x2="396" y2="333" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.76"/>
      <stop offset="0.34" stop-color="#C8F8F4" stop-opacity="0.24"/>
      <stop offset="0.7" stop-color="#83A5BA" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D8E5FF" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="surfaceLight" x1="148" y1="190" x2="325" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="statusHalo">
      <stop stop-color="#DFFFFA" stop-opacity="0.58"/>
      <stop offset="0.35" stop-color="#9AF8EC" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#76E9DF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="status" x1="346" y1="242" x2="366" y2="271" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#DFFFF8"/>
      <stop offset="1" stop-color="#83E8DE"/>
    </linearGradient>
    <clipPath id="islandClip">
      <rect x="80" y="174" width="352" height="164" rx="82"/>
    </clipPath>
    <filter id="islandShadow" x="48" y="146" width="416" height="236" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000A12" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- App-icon silhouette -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#background)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#ambient)"/>
  <path d="M132 16h248c64.2 0 116 51.8 116 116v22C380 65 194 51 16 179v-47C16 67.8 67.8 16 132 16Z" fill="#FFFFFF" opacity="0.035"/>
  <rect x="17" y="17" width="478" height="478" rx="115" fill="none" stroke="#C6E7EE" stroke-opacity="0.09"/>

  <!-- Quiet pool of light beneath the floating island -->
  <ellipse cx="256" cy="361" rx="142" ry="23" fill="#43CBD4" opacity="0.1"/>

  <!-- One continuous glass island -->
  <g filter="url(#islandShadow)">
    <rect x="80" y="174" width="352" height="164" rx="82" fill="#10202A" fill-opacity="0.72"/>
    <g clip-path="url(#islandClip)">
      <rect x="80" y="174" width="352" height="164" fill="url(#glass)"/>
      <path d="M55 285C113 244 156 220 218 218c58-2 76-34 127-25 37 7 70 30 112 58v112H55Z" fill="url(#liquid)"/>
      <path d="M55 285C113 244 156 220 218 218c58-2 76-34 127-25 37 7 70 30 112 58v112H55Z" fill="url(#liquidShade)"/>
      <path d="M73 272c53-36 98-53 150-53 55 0 77-31 125-23 35 6 63 24 91 43" fill="none" stroke="#D8FFFA" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
      <path d="M102 191c61-18 131-12 188-8 43 3 81 10 113 27-73-19-136-15-198-7-48 6-76-1-103-12Z" fill="url(#surfaceLight)" opacity="0.42"/>
      <ellipse cx="162" cy="192" rx="67" ry="22" fill="#FFFFFF" opacity="0.055"/>
    </g>
    <rect x="81" y="175" width="350" height="162" rx="81" fill="none" stroke="url(#rim)" stroke-width="2"/>
    <rect x="86" y="180" width="340" height="152" rx="76" fill="none" stroke="#D8FAF6" stroke-opacity="0.08"/>
  </g>

  <!-- Media-like information marks: abstract, never tiny text -->
  <rect x="132" y="245" width="91" height="10" rx="5" fill="#F2FFFD" opacity="0.94"/>
  <rect x="132" y="267" width="57" height="7" rx="3.5" fill="#E8FAF8" opacity="0.55"/>

  <!-- Live status point -->
  <circle cx="355" cy="256" r="38" fill="url(#statusHalo)"/>
  <circle cx="355" cy="256" r="17" fill="url(#status)"/>
  <circle cx="350" cy="251" r="5" fill="#FFFFFF" opacity="0.9"/>
</svg>
