<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>404 · FluidBar</title>
  <style>
    :root { color-scheme: light; --ink:#0b0d10; --muted:#596572; --line:#d8dee5; --paper:#f2f3f4; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:32px; background:var(--paper); color:var(--ink); font:15px/1.6 "Segoe UI",system-ui,sans-serif; }
    main { width:min(680px,100%); padding:48px; border:1px solid var(--line); border-radius:24px; background:rgba(255,255,255,.72); }
    p { margin:0 0 18px; color:var(--muted); }
    .eyebrow { font:11px/1.4 "Cascadia Mono",Consolas,monospace; letter-spacing:.14em; }
    h1 { margin:0 0 18px; font-size:clamp(44px,8vw,86px); line-height:.92; letter-spacing:-.07em; }
    a { display:inline-block; margin-top:14px; padding:10px 15px; border-radius:8px; background:var(--ink); color:#fff; text-decoration:none; font-size:13px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">FLUIDBAR / 404</p>
    <h1>这里没有<br>这扇窗。</h1>
    <p>请求的静态文件不存在。市场索引与 schema 只在真实文件存在时返回 JSON，不会回退成官网首页。</p>
    <a href="/">回到 FluidBar 官网</a>
  </main>
</body>
</html>
