<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>FluidBar · 图标选择</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./icon-options/study.css">
  <script src="./icon-options/study.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a class="back" href="https://fluidbar.doulor.cn/">← 返回官网</a>
      <div class="heading"><div><p class="eyebrow">FLUIDBAR / ICON STUDY</p><h1>图标，简单一点。</h1></div><div class="current"><img src="./favicon.svg" width="32" height="32" alt="FluidBar 现用图标"><span>现用图标</span></div></div>
      <p class="intro">24 款 SVG，四组不同方向：简洁几何、字母字标、空间负形、柔和色彩。点选一款，对比大图和 16 / 24 / 32px 的实际显示效果。</p>
      <p class="note">这里只作候选预览，尚未替换官网或软件图标。选择后可以直接告诉我编号。</p>
    </header>
    <form>
      <fieldset>
        <legend class="sr-only">选择图标方向</legend>
        <div class="options" id="options"></div>
      </fieldset>
    </form>
    <section class="selection" aria-label="当前选择">
      <img id="selected-image" src="./icon-options/01-single.svg" width="48" height="48" alt="">
      <div class="selection-copy" role="status"><strong id="selected-name">01 · 单岛</strong><p>先看小尺寸下是否清晰，再看放大后的细节。</p></div>
      <a id="download" href="./icon-options/01-single.svg" download="fluidbar-01-single.svg">下载这款 SVG ↗</a>
    </section>
    <noscript><p>此选择页需要 JavaScript。也可直接查看 SVG：<a href="./icon-options/01-single.svg">01 单岛</a>、<a href="./icon-options/02-signal.svg">02 一点</a>、<a href="./icon-options/03-floating.svg">03 悬浮</a>、<a href="./icon-options/04-outline.svg">04 轮廓</a>、<a href="./icon-options/05-layers.svg">05 错层</a>、<a href="./icon-options/06-silver.svg">06 银底</a>、<a href="./icon-options/07-letter-f.svg">07 字母 F</a>、<a href="./icon-options/08-monogram.svg">08 合字 FB</a>、<a href="./icon-options/09-soft-f.svg">09 柔笔 f</a>、<a href="./icon-options/10-step-f.svg">10 阶梯 F</a>、<a href="./icon-options/11-letter-b.svg">11 圆角 b</a>、<a href="./icon-options/12-cutout-f.svg">12 负形 F</a>、<a href="./icon-options/13-orbit.svg">13 轨道</a>、<a href="./icon-options/14-window.svg">14 窗口</a>、<a href="./icon-options/15-arch.svg">15 拱门</a>、<a href="./icon-options/16-negative.svg">16 留白</a>、<a href="./icon-options/17-continuous.svg">17 连环</a>、<a href="./icon-options/18-brackets.svg">18 留隙</a>、<a href="./icon-options/19-ivory.svg">19 暖纸</a>、<a href="./icon-options/20-blue.svg">20 雾蓝</a>、<a href="./icon-options/21-sage.svg">21 鼠尾草</a>、<a href="./icon-options/22-horizon.svg">22 日界</a>、<a href="./icon-options/23-titanium.svg">23 钛灰</a>、<a href="./icon-options/24-ink.svg">24 墨线</a>。</p></noscript>
  </main>
</body>
</html>
