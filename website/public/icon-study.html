<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>FluidBar · 图标选择</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./icon-options/study.css">
  <script src="./icon-options/study.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a class="back" href="https://fluidbar.doulor.cn/">← 返回官网</a>
      <div class="heading"><div><p class="eyebrow">FLUIDBAR / ICON STUDY</p><h1>图标，简单一点。</h1></div><div class="current"><img src="./favicon.svg" width="32" height="32" alt="FluidBar 现用图标"><span>现用图标</span></div></div>
      <p class="intro">六个朴素的 SVG 方向。点选一款，对比大图和 16 / 24 / 32px 的实际显示效果。</p>
      <p class="note">这里只作候选预览，尚未替换官网或软件图标。选择后可以直接告诉我编号。</p>
    </header>
    <form>
      <fieldset>
        <legend class="sr-only">选择图标方向</legend>
        <div class="options" id="options"></div>
      </fieldset>
    </form>
    <section class="selection" aria-label="当前选择">
      <img id="selected-image" src="./icon-options/01-single.svg" width="48" height="48" alt="">
      <div class="selection-copy" role="status"><strong id="selected-name">01 · 单岛</strong><p>先看小尺寸下是否清晰，再看放大后的细节。</p></div>
      <a id="download" href="./icon-options/01-single.svg" download="fluidbar-01-single.svg">下载这款 SVG ↗</a>
    </section>
    <section class="background-note" aria-labelledby="background-title">
      <p class="eyebrow">关于官网预览的背景</p><h2 id="background-title">让背景亮一点，让小岛更清楚。</h2>
      <p>更推荐偏亮的冷蓝灰桌面，配深色灵动岛；其次是干净的银白衬底。减轻暗角和光晕，让黑曜石、亚克力和液态玻璃的差别更容易看出来。</p>
      <p class="note">本页只调整图标候选，官网预览背景尚未修改。</p>
    </section>
    <noscript><p>此选择页需要 JavaScript。也可直接查看 SVG：<a href="./icon-options/01-single.svg">01 单岛</a>、<a href="./icon-options/02-signal.svg">02 一点</a>、<a href="./icon-options/03-floating.svg">03 悬浮</a>、<a href="./icon-options/04-outline.svg">04 轮廓</a>、<a href="./icon-options/05-layers.svg">05 错层</a>、<a href="./icon-options/06-silver.svg">06 银底</a>。</p></noscript>
  </main>
</body>
</html>
