<!DOCTYPE html>
<html lang="zh-CN" data-ready="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="FluidBar 2.0 — interactive design prototype for the Windows dynamic island rewrite.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2308080A'/%3E%3Crect x='8' y='13' width='15' height='6' rx='3' fill='%23f7f7f8'/%3E%3Ccircle cx='21.5' cy='16' r='1.8' fill='%234CC9F0'/%3E%3C/svg%3E">
  <title>FluidBar 2.0 · 交互原型</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* The archipelago is deliberately detached from the shell. These ID-level
       rules keep it 10px below the 440×284 panel (and above it in dock mode)
       even if the generic .arch block is regenerated: no in-panel scrim, and
       no fixed left slots — app.js owns baseX + spring shifts. */
    #arch {
      position: absolute;
      left: 50%;
      top: calc(100% + 10px);
      bottom: auto;
      z-index: 2;
      width: 352px;
      height: 34px;
      transform-origin: 50% 0;
    }
    #arch::before { content: none !important; display: none !important; }
    body[data-mode="dock"] #arch {
      top: auto;
      bottom: calc(100% + 10px);
      transform-origin: 50% 100%;
    }
    #arch .arch-island { left: 50% !important; }
  </style>
</head>
<body data-mode="float" data-material="obsidian" data-theme="dark" data-motion="normal" data-lang="zh">

  <!-- =====================================================================
       SCENE — a simulated Windows 11 desktop. Generated by app.js.
       ===================================================================== -->
  <main class="scene" id="scene" aria-label="Windows desktop simulation">
    <div class="wallpaper" aria-hidden="true">
      <div class="wallpaper-base"></div>
      <div class="wallpaper-mesh mesh-a"></div>
      <div class="wallpaper-mesh mesh-b"></div>
      <div class="wallpaper-contours"></div>
      <div class="wallpaper-grain"></div>
      <div class="wallpaper-vignette"></div>
    </div>
    <div class="desktop-icons" id="desktopIcons"></div>
    <div class="scene-windows" id="sceneWindows"></div>
    <div class="scene-hint" id="sceneHint"></div>
  </main>

  <!-- =====================================================================
       ISLAND — one morphing shell. Anchored to the scene, hero of the page.
       ===================================================================== -->
  <div class="island-layer" id="islandLayer">
    <div class="island-anchor" id="islandAnchor">
      <div class="ghost-pill ghost-a" id="ghostA" aria-hidden="true"></div>
      <div class="ghost-pill ghost-b" id="ghostB" aria-hidden="true"></div>
      <div class="island" id="island" tabindex="0" aria-label="FluidBar 灵动岛" aria-expanded="false">
        <div class="shell-clip" id="shellClip">
          <div class="compact-layer" id="compactLayer"></div>
          <div class="expanded-layer" id="expandedLayer" aria-hidden="true">
            <div class="pager" id="pager">
              <div class="pager-viewport" id="pagerViewport">
                <div class="pager-track" id="pagerTrack"></div>
              </div>
              <div class="pager-scrim pager-scrim-top" aria-hidden="true"></div>
              <div class="pager-top" id="pagerTop">
                <div class="pager-heading">
                  <span class="pager-title" id="pagerTitle"></span>
                  <span class="pager-count" id="pagerCount"></span>
                  <button class="pager-action" id="pagerAction" type="button" hidden></button>
                </div>
                <button class="pager-close" id="pagerClose" type="button" data-act="collapse"></button>
              </div>
              <div class="pager-scrim pager-scrim-bottom" aria-hidden="true"></div>
              <div class="pager-edge pager-edge-top" aria-hidden="true"></div>
              <div class="pager-edge pager-edge-bottom" aria-hidden="true"></div>
              <span class="pager-live sr-only" id="pagerLive" aria-live="polite" aria-atomic="true"></span>
            </div>
          </div>
        </div>
      </div>
      <!-- Page Archipelago: detached mini-island strip, floating below the shell.
           Deliberately outside .island / .shell-clip so it never covers panel content. -->
      <div class="arch" id="arch" aria-hidden="true" inert>
        <div class="arch-viewport" id="archViewport">
          <div class="arch-track" id="archTrack" role="tablist"></div>
        </div>
      </div>
      <div class="stack-badge" id="stackBadge" hidden>+2</div>
    </div>
  </div>

  <!-- Windows taskbar (scene furniture) -->
  <div class="taskbar" id="taskbar"></div>

  <!-- FluidBar dock (mode=dock replacement) -->
  <div class="fluid-dock" id="fluidDock" aria-hidden="true"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- =====================================================================
       DEMO CONSOLE — prototype-only chrome, generated by app.js.
       ===================================================================== -->
  <aside class="console" id="console" aria-label="Prototype demo console"></aside>
  <button class="console-handle" id="consoleHandle" type="button" aria-expanded="false"></button>

  <!-- =====================================================================
       SETTINGS + PLUGIN MARKET modal
       ===================================================================== -->
  <div class="modal-layer" id="modalLayer" hidden>
    <div class="modal-scrim" data-action="close-modal"></div>
    <div class="settings-window" id="settingsWindow" role="dialog" aria-modal="true" aria-label="FluidBar settings" tabindex="-1"></div>
  </div>

  <!-- Design annotation overlay -->
  <div class="annotations" id="annotations" hidden aria-hidden="true">
    <svg class="measure-svg" id="measureSvg" aria-hidden="true"></svg>
    <div class="spec-card" id="specCard"></div>
  </div>

  <div class="boot-shade" id="bootShade" aria-hidden="true"></div>

  <noscript>
    <div style="position:fixed;inset:0;z-index:9999;background:#08080a;color:#fff;display:grid;place-items:center;font:14px 'Segoe UI',sans-serif">
      This prototype requires JavaScript.
    </div>
  </noscript>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
