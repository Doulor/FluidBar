<!DOCTYPE html>
<html lang="zh-CN" data-ready="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="FluidBar 2.0 — a focused interactive prototype for the Windows dynamic-island rewrite. Morphing transient preview islands, far-page dots, six-page pager, settings + plugin marketplace, pixel-tight compact states.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2308080A'/%3E%3Crect x='8' y='13' width='15' height='6' rx='3' fill='%23f7f7f8'/%3E%3Ccircle cx='21.5' cy='16' r='1.8' fill='%234CC9F0'/%3E%3C/svg%3E">
  <title>FluidBar 2.0 · 交互原型</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="float" data-theme="dark" data-lang="zh" data-motion="normal" data-state="idle"
      data-material="obsidian" data-anchor="center" data-hover="on">

  <!-- =====================================================================
       SCENE — a minimal Windows 11 desktop, generated by app.js.
       ===================================================================== -->
  <main class="scene" id="scene" aria-label="Windows desktop simulation">
    <div class="wallpaper" aria-hidden="true">
      <div class="wallpaper-base"></div>
      <div class="wallpaper-glow glow-a"></div>
      <div class="wallpaper-glow glow-b"></div>
      <div class="wallpaper-glow glow-c"></div>
      <div class="wallpaper-grain"></div>
      <div class="wallpaper-vignette"></div>
    </div>
    <div class="desktop-icons" id="desktopIcons" aria-hidden="true"></div>
    <div class="scene-windows" id="sceneWindows" aria-hidden="true"></div>
    <div class="scene-hint" id="sceneHint"></div>
  </main>

  <!-- =====================================================================
       ISLAND — one morphing shell. Compact states are pixel-tight; the
       expanded panel is 440×284 with a 20/12 content inset.
       ===================================================================== -->
  <div class="island-layer" id="islandLayer">
    <div class="island-anchor" id="anchor" data-expanded="false">
      <div class="island" id="island" data-view="idle" data-expanded="false"
           tabindex="0" role="group" aria-expanded="false" aria-label="FluidBar">
        <div class="compact-layer" id="compactLayer"></div>
        <div class="expanded-layer" id="expandedLayer" aria-hidden="true" inert>
          <div class="pager" id="pager">
            <div class="pager-viewport" id="pagerViewport">
              <div class="pager-track" id="pagerTrack"></div>
            </div>
          </div>
        </div>
        <div class="pager-title" id="pagerTitle" aria-hidden="true"></div>
        <button class="pager-collapse" id="pagerCollapse" type="button" tabindex="-1" aria-label="Collapse">
          <span id="pagerCollapseIcon"></span>
        </button>
      </div>

      <!-- Transient preview islands: detached, below the shell, never at rest.
           The three pills are decorative; the far-page dots inside are real
           buttons, so the rail itself is not aria-hidden. -->
      <div class="mini-rail" id="miniRail"></div>
    </div>
  </div>

  <!-- Dock mode replacement for the taskbar. -->
  <div class="dock" id="dock" aria-label="FluidBar dock"></div>

  <!-- Windows taskbar (scene furniture). -->
  <div class="taskbar" id="taskbar" aria-hidden="true"></div>

  <!-- =====================================================================
       DEMO CONSOLE — triggers, mode, theme, language, motion.
       ===================================================================== -->
  <aside class="console" id="console" aria-label="Demo console"></aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- =====================================================================
       SETTINGS + PLUGIN MARKETPLACE — 900×620 modal, generated by app.js.
       ===================================================================== -->
  <div class="modal-layer" id="modalLayer" hidden>
    <div class="modal-scrim" data-action="close-modal"></div>
    <div class="settings-window" id="settingsWindow" role="dialog" aria-modal="true"
         aria-label="FluidBar settings" tabindex="-1"></div>
  </div>

  <div class="boot-shade" id="bootShade" aria-hidden="true"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
