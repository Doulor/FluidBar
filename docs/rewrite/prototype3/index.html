<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2308080A'/%3E%3Crect x='8' y='13' width='15' height='6' rx='3' fill='%23f7f7f8'/%3E%3Ccircle cx='21.5' cy='16' r='1.8' fill='%234CC9F0'/%3E%3C/svg%3E">
<title>FluidBar · 展开卡片（设置面板版面）</title>
<style>
:root{
  /* 规格全部取自动效/尺寸真值 SettingsMetrics + SettingsPalette */
  --shell:#08080a; --raised:#141418; --inset:#0e0e11;
  --line:rgba(255,255,255,.065); --line-2:rgba(255,255,255,.11);
  --fg:#ffffff; --fg-2:#9b9ba5; --fg-3:#86868f;
  --accent:#4cc9f0; --track:#f06ab0; --danger:#ff453a; --ok:#34c759;
  --r-win:22px; --r-nav:8px; --r-seg:8px;
  --ease:cubic-bezier(.3,.8,.25,1);
  --shadow:0 18px 44px -16px rgba(0,0,0,.78), 0 3px 10px -4px rgba(0,0,0,.42);
  --stage1:#1a1a1c; --stage2:#111113; --stage3:#202022;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#06070a;color:var(--fg);overflow:hidden;
  font:13px/1.35 "Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.display{font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
.stage{position:fixed;inset:0;background:linear-gradient(160deg,var(--stage1),var(--stage2) 58%,var(--stage3))}

/* ============ 岛外壳 ============ */
.island{position:fixed;top:56px;left:0;right:0;margin:0 auto;width:max-content;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.island[data-state="hidden"]{opacity:0;pointer-events:none}
.island[data-state="expanded"] .pill{display:none}
.island:not([data-state="expanded"]) .panel{display:none}

/* pill（沿用，尺寸不变） */
.pill{background:var(--shell);border-radius:999px;box-shadow:var(--shadow);
  display:flex;align-items:center;overflow:hidden;transition:width 420ms var(--ease),height 420ms var(--ease)}
.p-idle{width:238px;height:46px;padding:0 15px;gap:10px}
.p-media{width:352px;height:56px;padding:0 10px 0 8px;gap:11px}
.p-note{width:368px;height:58px;padding:0 8px;gap:11px}
.p-agent{width:312px;height:52px;padding:0 15px;gap:11px}
.island[data-state="peek"] .p-idle{width:248px;height:52px}
.island[data-state="peek"] .p-media{width:362px;height:62px}
.island[data-state="peek"] .p-note{width:378px;height:62px}
.island[data-state="peek"] .p-agent{width:322px;height:52px}
.pill__dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.pill__clock{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.pill__meta{color:var(--fg-3);font-size:11.5px;display:flex;align-items:center;gap:7px;min-width:0}
.pill__grow{flex:1}
.pill__stack{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.pill__title{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill__sub{font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{width:40px;height:40px;border-radius:10px;flex:none;background:linear-gradient(150deg,#1c1c22,#23232a)}
.pill__bar{position:absolute;left:10px;right:10px;bottom:5px;height:2px;border-radius:2px;background:#23232a;overflow:hidden}
.pill__bar span{display:block;height:100%;background:var(--track);transition:width 240ms linear}
.pctrl{display:flex;gap:2px;flex:none}
.pctrl button{width:28px;height:28px;border:0;background:none;color:var(--fg-2);cursor:pointer;border-radius:8px;
  display:grid;place-items:center;font-size:12px}
.pctrl button:hover{background:rgba(255,255,255,.08);color:var(--fg)}
.pctrl button.main{background:rgba(255,255,255,.1);color:var(--fg)}
.pill__app{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;
  font-size:10.5px;font-weight:650;color:var(--fg-2);flex:none}
.pill--secondary{width:330px;height:50px;padding:0 8px;gap:10px;border-radius:999px}
.ring{width:26px;height:26px;border-radius:50%;flex:none;box-sizing:border-box;
  border:2.5px solid #23232a;border-top-color:var(--accent);border-right-color:var(--accent);
  animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 展开卡片 = 设置面板版面 ============ */
.panel{width:var(--w,860px);height:560px;border-radius:var(--r-win);overflow:hidden;
  display:flex;flex-direction:column;background:var(--shell);box-shadow:var(--shadow);
  animation:panelIn 420ms var(--ease) both}
@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.island[data-size="small"]{--w:520px}
.island[data-size="small"] .nav{display:none}

/* 标题栏 50 / pad 18 12 / mark 24 r8 / title 13 / sub 9 uppercase */
.titlebar{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 18px}
.mark{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.mark i{width:11px;height:4px;border-radius:2px;background:var(--accent);display:block}
.tb-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.tb-text b{font-size:13px;font-weight:600;letter-spacing:.005em}
.tb-text span{font-size:9px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-spacer{flex:1}
.tb-close{width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--fg-2);cursor:pointer;
  display:grid;place-items:center;flex:none}
.tb-close:hover{background:rgba(255,255,255,.08);color:var(--fg)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:208px minmax(0,1fr)}
.island[data-size="small"] .body{grid-template-columns:minmax(0,1fr)}

/* 侧栏 208 / padY14 padX10 / item 40 r8 / icon18 / label13 / count16 r5 */
.nav{display:flex;flex-direction:column;padding:14px 10px;min-height:0}
.nav-kicker{font-size:8.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3);
  padding:4px 10px 7px}
.nav-item{height:40px;border:0;border-radius:var(--r-nav);background:none;color:var(--fg-2);cursor:pointer;
  display:flex;align-items:center;gap:9px;padding:0 10px;font:inherit;font-size:13px;text-align:left}
.nav-item + .nav-item{margin-top:2px}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.nav-item[aria-current="true"]{background:rgba(255,255,255,.09);color:var(--fg);font-weight:600}
.nav-item svg{flex:none;opacity:.9}
.nav-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{height:16px;min-width:16px;padding:0 4px;border-radius:5px;background:rgba(255,255,255,.1);
  color:var(--fg-2);font-size:8.5px;font-weight:600;display:grid;place-items:center;flex:none}
.nav-item[aria-current="true"] .cnt{background:rgba(255,255,255,.16);color:var(--fg)}
.nav-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line)}
.nav-foot b{display:block;font-size:8.5px;font-weight:500;color:var(--fg-2)}
.nav-foot span{font-size:8.5px;line-height:1.5;color:var(--fg-3)}

/* 内容区 pad 30/24，页头 22，说明 11，小标题 11 大写，行 48/53 */
.pane{overflow-y:auto;padding:24px 30px 30px;min-width:0;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
.pane::-webkit-scrollbar{width:9px}
.pane::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:5px;border:3px solid var(--shell);background-clip:content-box}
.island[data-size="small"] .pane{padding:20px 18px 24px}
.pane-head{font-size:22px;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin:0 0 4px}
.pane-desc{font-size:11px;line-height:1.55;color:var(--fg-2);margin:0 0 18px;max-width:560px}
.caption{font-size:11px;font-weight:600;letter-spacing:.036em;text-transform:uppercase;color:var(--fg-3);
  margin:20px 0 2px;display:flex;align-items:center;gap:8px}
.caption:first-of-type{margin-top:8px}
.caption .spacer{flex:1}
.group{border-top:1px solid var(--line)}
.caption + .group{border-top:0}

.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;
  min-height:48px;padding:8px 8px 8px 2px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.group .row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.04)}
.row[aria-selected="true"]{background:rgba(255,255,255,.06)}
.row-text{min-width:0}
.row-title{font-size:13px;font-weight:500;line-height:1.35;color:var(--fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-desc{font-size:10px;line-height:1.45;color:var(--fg-3);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-ctl{display:flex;align-items:center;gap:8px;flex:none}
.row-val{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--fg-3);font-size:13px;line-height:1}
.row:hover .chev{color:var(--fg-2)}

/* 控件：分段 26 r8、开关 38×22、细条 */
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-seg);background:rgba(255,255,255,.05)}
.seg button{height:22px;padding:0 9px;border:0;border-radius:6px;background:none;color:var(--fg-2);
  font:inherit;font-size:9.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg)}
.sw{width:38px;height:22px;border-radius:11px;background:rgba(255,255,255,.14);position:relative;flex:none;
  transition:background 200ms var(--ease)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:transform 200ms var(--ease)}
.sw[aria-checked="true"] i{transform:translateX(16px)}
.bar{width:120px;height:4px;border-radius:2px;background:#23232a;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.track i{background:var(--track)}
.mini{width:24px;height:24px;border:0;border-radius:7px;background:rgba(255,255,255,.08);color:var(--fg-2);
  cursor:pointer;display:grid;place-items:center;font-size:11px}
.mini:hover{background:rgba(255,255,255,.16);color:var(--fg)}
.big{width:34px;height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.1);color:var(--fg);
  cursor:pointer;display:grid;place-items:center;font-size:13px}
.big:hover{background:rgba(255,255,255,.18)}
.empty{padding:26px 0;color:var(--fg-3);font-size:11.5px;text-align:center}

/* 浮层 */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);opacity:0;background:rgba(32,32,34,.98);
  border-radius:999px;padding:8px 14px;font-size:12px;z-index:50;box-shadow:var(--shadow);pointer-events:none;
  transition:opacity 200ms var(--ease),transform 200ms var(--ease)}
.toast[data-on="true"]{opacity:1;transform:translate(-50%,0)}
.menu{position:fixed;z-index:60;min-width:176px;padding:5px;border-radius:12px;background:rgba(26,26,28,.98);
  box-shadow:var(--shadow);opacity:0;transform:scale(.97);pointer-events:none;transform-origin:top left;
  transition:opacity 160ms var(--ease),transform 160ms var(--ease)}
.menu[data-on="true"]{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;width:100%;gap:8px;border:0;background:none;color:var(--fg);font:inherit;font-size:12.5px;
  padding:7px 9px;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu button.danger{color:var(--danger)}
.menu button .k{margin-left:auto;color:var(--fg-3);font-size:10px}
.help{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(4,6,10,.72);opacity:0;
  pointer-events:none;transition:opacity 200ms var(--ease)}
.help[data-on="true"]{opacity:1;pointer-events:auto}
.help__card{width:min(520px,88vw);background:rgba(24,24,26,.98);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.help h3{margin:0 0 10px;font-size:13px}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:12px;color:var(--fg-2)}
.help dt{color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 左下：原型状态与外观（不属于卡片） */
.dock{position:fixed;left:18px;bottom:16px;z-index:6;display:flex;flex-direction:column;gap:7px;max-width:320px}
.dock h1{margin:0;font-size:12px;color:var(--fg)}
.dock p{margin:0;font-size:11px;line-height:1.55;color:var(--fg-3)}
.dock .grp{display:flex;gap:5px;flex-wrap:wrap}
.dock button{border:0;background:rgba(255,255,255,.06);color:var(--fg-2);font:inherit;font-size:11px;
  border-radius:8px;padding:5px 9px;cursor:pointer}
.dock button:hover{background:rgba(255,255,255,.12);color:var(--fg)}
.dock button[aria-pressed="true"]{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;transition-duration:1ms !important}}
</style>
<body>
<div class="stage"></div>

<div class="island" id="island" data-state="expanded" data-size="large">
  <div class="pill" id="pill1"></div>
  <div class="pill pill--secondary" id="pill2" style="display:none"></div>

  <div class="panel" role="dialog" aria-label="FluidBar">
    <header class="titlebar">
      <div class="mark"><i></i></div>
      <div class="tb-text"><b>FLUIDBAR</b><span id="tbSub">灵动岛 · 展开</span></div>
      <div class="tb-spacer"></div>
      <button class="tb-close" id="collapseBtn" title="收起（Esc）">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </header>
    <div class="body">
      <nav class="nav" id="nav"></nav>
      <div class="pane" id="pane" tabindex="0"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="menu" id="menu" role="menu"></div>
<div class="help" id="help">
  <div class="help__card">
    <h3>键盘</h3>
    <dl>
      <dt>1 – 6</dt><dd>切换页面</dd>
      <dt>↑ ↓</dt><dd>在行间移动</dd>
      <dt>Enter</dt><dd>执行（复制 / 打开 / 播放）</dd>
      <dt>Del</dt><dd>删除当前行</dd>
      <dt>右键</dt><dd>更多（固定 / 已读 / 删除）</dd>
      <dt>Esc</dt><dd>收起成 pill</dd>
      <dt>?</dt><dd>打开 / 关闭本帮助</dd>
    </dl>
  </div>
</div>

<div class="dock">
  <h1>原型控制（不属于卡片）</h1>
  <p>按设置面板的版面重构：左侧导航 208 + 右侧单栏文档式分组，标题栏 50、页内边距 30/24、行 48、分隔只有行内一条发丝线。页脚键盘条已删除。</p>
  <div class="grp" id="stateBtns">
    <button data-state="hidden">隐藏</button>
    <button data-state="idle">空闲</button>
    <button data-state="media">媒体</button>
    <button data-state="note">通知</button>
    <button data-state="agent">Agent</button>
    <button data-state="peek">Peek</button>
    <button data-state="expanded" aria-pressed="true">展开</button>
  </div>
  <div class="grp">
    <button data-act="size">尺寸：860</button>
  </div>
</div>
</body>

 {title:'Midnight City',artist:'M83',album:'Hurry Up, We are Dreaming',len:244,lyric:'等待光线 · 城市在呼吸'},
 {title:'Nightcall',artist:'Kavinsky',album:'OutRun',len:258,lyric:'引擎在雨里低鸣'},
 {title:'Sunset Lover',artist:'Petit Biscuit',album:'Presence',len:238,lyric:'海风把日落吹成橘色'}

/* ---------- 行构造（严格照 setting-row：13/10 + 右侧控件 + 一条下划发丝线） ---------- */
function row(o){
  var idAttr=o.id!=null?' data-id="'+o.id+'"':'';
  var selAttr=o.id!=null&&S.sel[o.id]?' aria-selected="true"':'';
  var actAttr=o.act?' data-act="'+o.act+'"':'';
  var ctl='';
  if(o.bar!=null){ctl+='<div class="bar'+(o.track?' track':'')+'"><i style="width:'+Math.round(o.bar)+'%"></i></div>'}
  if(o.sw!=null){ctl+='<div class="sw" data-sw="'+o.sw+'" role="switch" aria-checked="'+(!!S[o.sw]||!!o.swOn)+'"><i></i></div>'}
  if(o.ctl){ctl+=o.ctl}
  if(o.val){ctl+='<span class="row-val">'+o.val+'</span>'}
  if(o.chev){ctl+='<span class="chev">›</span>'}
  return '<div class="row"'+idAttr+selAttr+actAttr+' tabindex="-1">'+
    '<div class="row-text"><div class="row-title">'+o.title+'</div>'+
    (o.desc?'<div class="row-desc">'+o.desc+'</div>':'')+'</div>'+
    '<div class="row-ctl">'+ctl+'</div></div>';
}
function group(rows){return '<div class="group">'+rows.join('')+'</div>'}
function caption(text,right){return '<div class="caption"><span>'+text+'</span><span class="spacer"></span>'+(right||'')+'</div>'}
function seg(items,current,attr){
  return '<div class="seg">'+items.map(function(it){
    return '<button '+(attr||'data-filter')+'="'+it[0]+'" aria-pressed="'+(current===it[0])+'">'+it[1]+'</button>';
  }).join('')+'</div>';
}
function head(title,desc){return '<h2 class="pane-head">'+title+'</h2>'+(desc?'<p class="pane-desc">'+desc+'</p>':'')}
</script>
<script>
'use strict';

function navCounts(){
  var out={};
  out.messages=NOTES.filter(function(n){return n.unread}).length;
  out.agent=AGENTS.filter(function(a){return a.tone==='run'}).length;
  return out;
}
function renderNav(){
  var counts=navCounts();
  var html='<div class="nav-kicker">页面</div>';
  NAV.forEach(function(n){
    var c=counts[n.id];
    html+='<button class="nav-item" data-page="'+n.id+'" aria-current="'+(S.page===n.id)+'">'+n.icon+
      '<span class="lbl">'+n.label+'</span>'+(c?'<span class="cnt">'+c+'</span>':'')+'</button>';
  });
  html+='<div class="nav-foot"><b>FluidBar 设计原型</b><span>按设置面板版面重构</span></div>';
  els.nav.innerHTML=html;
}

function clipRows(list){
  return list.map(function(c){
    return row({id:c.id,title:esc(c.title),desc:c.kind+' · '+rel(c.at)+(c.pinned?' · 已固定':''),
      val:hhmm(c.at),chev:true});
  });
}
function noteRows(list){
  return list.map(function(n){
    return row({id:n.id,title:(n.unread?'● ':'')+esc(n.title),desc:esc(n.app)+' · '+rel(n.at),
      val:hhmm(n.at),chev:true});
  });
}
var KIND_FILTER={'全部':function(){return true},'已固定':function(c){return c.pinned},
  '图片':function(c){return c.kind==='图片'},'链接':function(c){return /^https?:/.test(c.body)}};

function paneHtml(){
  if(S.page==='home'){
    var d=new Date();
    return head('概览','2026 年 10 月 26 日 · 周五 · 18° 多云 · 电量 87%')+
      caption('设备')+
      group([
        row({title:'无线网络',desc:'WLAN · FluidBar-5G',val:'已连接'}),
        row({title:'电池',desc:'充电中 · 预计 1 小时 12 分充满',bar:87}),
        row({title:'音量',desc:'输出到 扬声器',bar:S.volume}),
        row({title:'亮度',desc:'跟随环境光',bar:S.brightness}),
      ])+
      caption('快捷')+
      group([
        row({title:'设置',desc:'打开独立设置窗口',act:'settings',chev:true}),
        row({title:'插件市场',desc:'浏览与安装插件',act:'market',chev:true}),
        row({title:'开发者工具',desc:'日志 · 性能 · 截图',act:'devtools',chev:true}),
      ]);
  }
  if(S.page==='media'){
    var t=TRACKS[S.track],cur=Math.round(t.len*S.pos);
    return head(S.playing?'正在播放':'已暂停',esc(t.artist)+' · '+esc(t.album))+
      caption('曲目')+
      group([
        row({title:'标题',val:esc(t.title)}),
        row({title:'艺术家',val:esc(t.artist)}),
        row({title:'专辑',val:esc(t.album)}),
        row({title:'时长',val:two(Math.floor(t.len/60))+':'+two(t.len%60)}),
      ])+
      caption('播放')+
      group([
        row({title:'进度',desc:esc(t.lyric),val:two(Math.floor(cur/60))+':'+two(cur%60),bar:S.pos*100,track:true}),
        row({title:'音量',val:String(S.volume),bar:S.volume}),
        row({title:'控制',desc:'空格键切换播放',
          ctl:'<button class="mini" data-m="prev">⏮</button>'+
              '<button class="big" data-m="play">'+(S.playing?'⏸':'▶')+'</button>'+
              '<button class="mini" data-m="next">⏭</button>'}),
      ]);
  }
  if(S.page==='messages'){
    var unread=NOTES.filter(function(n){return n.unread});
    var older=NOTES.filter(function(n){return !n.unread});
    var list=S.filter==='unread'?unread:NOTES;
    return head('消息',(unread.length)+' 条未读 / 共 '+NOTES.length+' 条。点一行打开，右键可标记或删除。')+
      caption('未读 ('+unread.length+')',seg([['all','全部'],['unread','只看未读']],S.filter))+
      group(noteRows(S.filter==='unread'?unread:unread))+
      (S.filter==='all'?caption('更早')+group(noteRows(older)):'');
  }
  if(S.page==='clipboard'){
    var test=KIND_FILTER[S.filter]||KIND_FILTER['全部'];
    var list=CLIPS.filter(test);
    var pinned=list.filter(function(c){return c.pinned});
    var rest=list.filter(function(c){return !c.pinned});
    var segHtml=seg([['全部','全部'],['已固定','已固定'],['图片','图片'],['链接','链接']],S.filter);
    return head('剪贴板','共 '+CLIPS.length+' 条 · '+CLIPS.filter(function(c){return c.pinned}).length+' 条固定。点一行即复制。')+
      caption('筛选',segHtml)+
      (pinned.length?caption('已固定')+group(clipRows(pinned)):'')+
      (rest.length?caption('最近')+group(clipRows(rest)):'')+
      (!list.length?'<div class="empty">没有符合条件的条目</div>':'');
  }
  if(S.page==='agent'){
    var run=AGENTS.filter(function(a){return a.tone==='run'});
    var done=AGENTS.filter(function(a){return a.tone!=='run'});
    function agentRows(list){
      return list.map(function(a){
        var pct=Math.round(a.done/a.total*100);
        return row({id:a.id,title:esc(a.task),desc:esc(a.tool)+' · '+esc(a.project)+' · '+esc(a.dur),
          val:pct+'%',bar:pct,chev:true});
      });
    }
    return head('Agent',run.length+' 个在跑 · '+AGENTS.length+' 个会话。点一行查看日志。')+
      caption('运行中 ('+run.length+')')+group(agentRows(run))+
      caption('已结束')+group(agentRows(done));
  }
  // widgets
  var d2=new Date();
  return head('组件','日历 · 天气 · 系统占用 · 任务')+
    caption('日历')+
    group([row({title:'今天',desc:'没有日程安排',val:'10 月 26 日 · 周五',chev:true})])+
    caption('天气')+
    group([row({title:'天气',val:'18° 多云'}),row({title:'高低温',val:'12° / 21°'}),row({title:'风',val:'东南 3 级'})])+
    caption('系统')+
    group([
      row({title:'CPU',desc:'8 核 · 平均负载 1.2',val:'38%',bar:38}),
      row({title:'内存',desc:'30.6 GB 中已用 19.6 GB',val:'64%',bar:64}),
      row({title:'磁盘',desc:'C: 剩余 4.2 GB',val:'81%',bar:81}),
      row({title:'网络',desc:'下载 / 上传',val:'22 / 4 Mbps',bar:22}),
    ])+
    caption('任务')+
    group(TASKS.map(function(t,i){
      return row({title:esc(t[0]),desc:t[1]?'已完成':'待办',
        ctl:'<div class="sw" data-task="'+i+'" role="switch" aria-checked="'+t[1]+'"><i></i></div>'});
    }));
}
function renderPane(){els.pane.innerHTML=paneHtml()}
function renderChrome(){
  els.island.dataset.state=S.state;
  els.island.dataset.size=S.size;
  var nav=NAV.filter(function(n){return n.id===S.page})[0];
  var counts=navCounts();
  var sub = S.page==='messages' ? '消息 · '+(counts.messages||0)+' 条未读'
    : S.page==='clipboard' ? '剪贴板 · '+CLIPS.length+' 条'
    : S.page==='agent' ? 'Agent · '+(counts.agent||0)+' 个在跑'
    : S.page==='media' ? (S.playing?'媒体 · 正在播放':'媒体 · 已暂停')
    : S.page==='widgets' ? '组件 · 日历 / 天气 / 系统'
    : '概览';
  els.tbSub.textContent=sub;
  renderNav();
}
function renderAll(){renderChrome();renderPane()}
function setPage(p){
  if(S.page===p)return;
  S.page=p;S.sel={};S.anchor=null;S.filter='all';
  renderAll();els.pane.scrollTop=0;
}
function setState(st){S.state=st;renderChrome();renderPills();
  qa('#stateBtns button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.state===st))})}

/* ---------- pill ---------- */
function renderPills(){
  if(S.state==='expanded'||S.state==='hidden')return;
  var base=S.state==='peek'?'idle':S.state;
  var p1=els.pill1,p2=els.pill2;
  p2.style.display='none';
  if(base==='idle'){
    p1.className='pill p-idle';
    p1.innerHTML='<i class="pill__dot"></i><span class="pill__clock">'+hhmm(new Date())+'</span>'+
      '<span class="pill__meta">周五 10/26</span><span class="pill__grow"></span>'+
      '<span class="pill__meta">87%</span>';
  }else if(base==='media'){
    var t=TRACKS[S.track];
    p1.className='pill p-media';
    p1.innerHTML='<div class="art"></div><div class="pill__stack"><div class="pill__title">'+esc(t.title)+
      '</div><div class="pill__sub">'+esc(t.artist)+'</div></div>'+
      '<div class="pctrl"><button data-m="prev">⏮</button><button class="main" data-m="play">'+(S.playing?'⏸':'▶')+
      '</button><button data-m="next">⏭</button></div>'+
      '<div class="pill__bar"><span style="width:'+Math.round(S.pos*100)+'%"></span></div>';
  }else if(base==='note'){
    var n=NOTES[0];
    p1.className='pill p-note';
    p1.innerHTML='<div class="pill__app">'+esc(n.icon)+'</div><div class="pill__stack">'+
      '<div class="pill__title">'+esc(n.title)+'</div><div class="pill__sub">'+esc(n.app)+' · '+rel(n.at)+'</div></div>'+
      '<div class="pctrl"><button data-note="open">开</button><button data-note="dismiss">✕</button></div>';
    p2.className='pill pill--secondary';p2.style.display='flex';
    var m2=NOTES[1];
    p2.innerHTML='<div class="pill__app">'+esc(m2.icon)+'</div><div class="pill__stack">'+
      '<div class="pill__title">'+esc(m2.title)+'</div><div class="pill__sub">'+esc(m2.app)+'</div></div>'+
      '<div class="pctrl"><button data-note="dismiss">✕</button></div>';
  }else if(base==='agent'){
    var a=AGENTS[0],pct=Math.round(a.done/a.total*100);
    p1.className='pill p-agent';
    p1.innerHTML='<div class="ring"></div><div class="pill__stack"><div class="pill__title">'+esc(a.task)+
      '</div><div class="pill__sub">'+esc(a.tool)+' · '+a.done+'/'+a.total+' · '+esc(a.dur)+'</div></div>'+
      '<div class="pctrl"><button data-agent="stop">■</button></div>';
  }
}
</script>
<script>
'use strict';

function selectedId(){
  for(var k in S.sel){if(S.sel[k])return Number(k)}
  return null;
}
function primaryAction(id){
  var target=id!=null?id:selectedId();
  if(S.page==='clipboard'){
    var c=null;CLIPS.forEach(function(x){if(x.id===target)c=x});
    if(!c)return;
    if(navigator.clipboard){try{navigator.clipboard.writeText(c.body||c.title)}catch(e){}}
    toast('已复制：'+(c.title||'').slice(0,20)+((c.title||'').length>20?'…':''));
    return;
  }
  if(S.page==='messages'){
    var n=null;NOTES.forEach(function(x){if(x.id===target)n=x});
    if(!n)return;
    if(n.unread){n.unread=false;renderAll()}
    toast('已打开：'+n.app);
    return;
  }
  if(S.page==='agent'){toast('打开会话日志');return}
}
function deleteRow(id){
  var target=id!=null?id:selectedId();
  if(target==null)return;
  var removed=0;
  for(var i=NOTES.length-1;i>=0;i--){if(NOTES[i].id===target){NOTES.splice(i,1);removed++}}
  for(var j=CLIPS.length-1;j>=0;j--){if(CLIPS[j].id===target){CLIPS.splice(j,1);removed++}}
  for(var k=AGENTS.length-1;k>=0;k--){if(AGENTS[k].id===target){AGENTS.splice(k,1);removed++}}
  delete S.sel[target];
  renderAll();toast(removed?'已删除':'—');
}
function togglePin(id){
  var target=id!=null?id:selectedId();
  CLIPS.forEach(function(c){if(c.id===target){c.pinned=!c.pinned;toast(c.pinned?'已固定到顶部':'已取消固定')}});
  renderAll();
}
function markRead(id){
  var target=id!=null?id:selectedId();
  NOTES.forEach(function(n){if(n.id===target&&n.unread){n.unread=false;toast('已标记已读')}});
  renderAll();
}
function mediaAction(kind){
  if(kind==='play'){S.playing=!S.playing;toast(S.playing?'继续播放':'已暂停')}
  else if(kind==='next'){S.track=(S.track+1)%TRACKS.length;S.pos=0;toast('下一首：'+TRACKS[S.track].title)}
  else if(kind==='prev'){S.track=(S.track-1+TRACKS.length)%TRACKS.length;S.pos=0;toast('上一首：'+TRACKS[S.track].title)}
  if(S.state==='media')renderPills();
  if(S.page==='media'){var top=els.pane.scrollTop;renderPane();els.pane.scrollTop=top;renderChrome()}
}

/* 导航 */
els.nav.addEventListener('click',function(e){
  var b=e.target.closest('[data-page]');if(!b)return;
  setPage(b.dataset.page);
});
/* 面板内交互 */
els.pane.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');
  if(m){e.stopPropagation();mediaAction(m.dataset.m);return}
  var f=e.target.closest('[data-filter]');
  if(f){S.filter=f.dataset.filter;S.sel={};var top=els.pane.scrollTop;renderPane();els.pane.scrollTop=top;return}
  var task=e.target.closest('[data-task]');
  if(task){var i=Number(task.dataset.task);TASKS[i][1]=!TASKS[i][1];var t2=els.pane.scrollTop;renderPane();els.pane.scrollTop=t2;
    toast(TASKS[i][1]?'已完成':'已取消');return}
  var sw=e.target.closest('[data-sw]');
  if(sw){S[sw.dataset.sw]=!S[sw.dataset.sw];renderPane();return}
  var rowEl=e.target.closest('.row');
  if(!rowEl)return;
  if(rowEl.dataset.act){toast({settings:'打开设置窗口',market:'打开插件市场',devtools:'打开开发者工具'}[rowEl.dataset.act]||'—');return}
  var id=rowEl.dataset.id?Number(rowEl.dataset.id):null;
  if(id!=null){S.sel={};S.sel[id]=true;
    qa('.row',els.pane).forEach(function(r){r.setAttribute('aria-selected',String(r.dataset.id?Number(r.dataset.id)===id:false))});
    primaryAction(id);}
});
/* 右键菜单 */
els.pane.addEventListener('contextmenu',function(e){
  var rowEl=e.target.closest('.row');if(!rowEl||!rowEl.dataset.id)return;
  e.preventDefault();
  var id=Number(rowEl.dataset.id);
  S.sel={};S.sel[id]=true;
  qa('.row',els.pane).forEach(function(r){r.setAttribute('aria-selected',String(r.dataset.id?Number(r.dataset.id)===id:false))});
  var page=S.page;
  els.menu.innerHTML=
    '<button data-act="primary">'+(page==='clipboard'?'复制':page==='agent'?'查看日志':'打开')+'<span class="k">Enter</span></button>'+
    (page==='clipboard'?'<button data-act="pin">固定 / 取消</button>':
     page==='agent'?'<button data-act="stop">中断执行</button>':'<button data-act="read">标记已读</button>')+
    '<button class="danger" data-act="del">删除<span class="k">Del</span></button>';
  els.menu.dataset.on='true';els.menu.dataset.id=String(id);
  var w=els.menu.offsetWidth,h=els.menu.offsetHeight;
  els.menu.style.left=Math.min(e.clientX,innerWidth-w-8)+'px';
  els.menu.style.top=Math.min(e.clientY,innerHeight-h-8)+'px';
});
els.menu.addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;
  var id=Number(els.menu.dataset.id),act=b.dataset.act;
  els.menu.dataset.on='false';
  if(act==='primary'){primaryAction(id);return}
  if(act==='pin'){togglePin(id);return}
  if(act==='read'){markRead(id);return}
  if(act==='stop'){toast('已中断会话');return}
  if(act==='del'){deleteRow(id);return}
});
document.addEventListener('pointerdown',function(e){
  if(!els.menu.contains(e.target))els.menu.dataset.on='false';
},true);

/* 键盘 */
function moveSel(delta){
  var rows=qa('.row[data-id]',els.pane);
  if(!rows.length)return;
  var curId=selectedId();
  var idx=-1;
  rows.forEach(function(r,i){if(Number(r.dataset.id)===curId)idx=i});
  var next=idx+delta;
  if(idx<0)next=delta>0?0:rows.length-1;
  next=Math.max(0,Math.min(rows.length-1,next));
  var id=Number(rows[next].dataset.id);
  S.sel={};S.sel[id]=true;
  rows.forEach(function(r,i){r.setAttribute('aria-selected',String(i===next))});
  rows[next].scrollIntoView({block:'nearest'});
}
addEventListener('keydown',function(e){
  var typing=e.target&&e.target.tagName==='INPUT';
  if(e.key==='?'&&!typing){e.preventDefault();els.help.dataset.on=els.help.dataset.on==='true'?'false':'true';return}
  if(e.key==='Escape'){
    if(els.help.dataset.on==='true'){els.help.dataset.on='false';return}
    if(els.menu.dataset.on==='true'){els.menu.dataset.on='false';return}
    if(S.state!=='expanded'){return}
    setState('idle');return;
  }
  if(typing)return;
  if(S.state!=='expanded'){if(e.key==='Enter'||e.key===' '||e.key==='e'){setState('expanded');return}}
  var order=['home','media','messages','clipboard','agent','widgets'];
  var n=parseInt(e.key,10);
  if(n>=1&&n<=6){setPage(order[n-1]);return}
  if(e.key==='ArrowDown'){e.preventDefault();moveSel(1);return}
  if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1);return}
  if(e.key==='Enter'){e.preventDefault();primaryAction(null);return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteRow(null);return}
  if(e.key===' '&&S.page==='media'){e.preventDefault();mediaAction('play');return}
});
els.help.addEventListener('click',function(){els.help.dataset.on='false'});
q('#collapseBtn').addEventListener('click',function(){setState('idle')});

/* pill 交互 */
els.island.addEventListener('click',function(e){
  if(S.state==='expanded')return;
  var m=e.target.closest('[data-m]');
  if(m){mediaAction(m.dataset.m);return}
  var nt=e.target.closest('[data-note]');
  if(nt){if(nt.dataset.note==='open'){setState('expanded');setPage('messages')}else toast('已清除');return}
  var ag=e.target.closest('[data-agent]');
  if(ag){toast('已中断');return}
  setState('expanded');
});

/* 媒体进度 */
setInterval(function(){
  if(!S.playing)return;
  var t=TRACKS[S.track];
  S.pos+=0.5/t.len;
  if(S.pos>=1){S.pos=0;S.track=(S.track+1)%TRACKS.length}
  if(S.state==='media')renderPills();
  if(S.page==='media'){
    var bar=qa('.row .bar',els.pane).filter(function(b){return b.classList.contains('track')})[0];
    if(bar){var i=bar.querySelector('i');if(i)i.style.width=Math.round(S.pos*100)+'%'}
    var vals=qa('.row-val',els.pane);
    if(vals.length){var cur=Math.round(TRACKS[S.track].len*S.pos);vals[0].textContent=two(Math.floor(cur/60))+':'+two(cur%60)}
  }
},500);

/* dock：状态与尺寸（原型控制，不属于卡片） */
q('#stateBtns').addEventListener('click',function(e){
  var b=e.target.closest('button[data-state]');if(!b)return;
  setState(b.dataset.state);
});
qa('.dock [data-act]').forEach(function(b){
  b.addEventListener('click',function(){
    if(b.dataset.act==='size'){
      S.size=S.size==='large'?'small':'large';
      b.textContent='尺寸：'+(S.size==='large'?'860':'520');
      renderChrome();renderPane();return;
    }
  });
});
qa('#stateBtns button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.state===S.state))});

renderAll();
</script>
</body>
</html>
